[package]
name = "mi-air-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
[dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "cookies", "json"] }
